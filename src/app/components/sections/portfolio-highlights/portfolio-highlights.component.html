<div
  id="portfolio"
  class="container max-w-[1600px] mx-auto px-7 min-[1400px]:px-14"
>
  <div class="bg-charcoal overflow-hidden w-full py-[70px] rounded-3xl">
    <div class="container max-w-[1320px] mx-auto px-7">
      <div
        class="space-y-4 xl:space-y-0 xl:flex xl:justify-between xl:items-end"
      >
        <h2
          class="relative font-poppins font-semibold text-5xl md:text-6xl xl:text-7xl leading-tight stroke-text-white after:content-[''] after:absolute after:top-0 after:right-0 after:-bottom-[9px] after:left-0 after:bg-gradient-to-t after:from-charcoal after:to-transparent"
        >
          Letzte Projekte
        </h2>

        <div class="flex flex-row justify-between gap-2">
          <ul class="space-x-1">
            <li
              class="portfolio-prev list-none inline-flex justify-center items-center relative w-12 h-12 rounded-full text-white cursor-pointer before:content-[''] before:absolute before:top-0 before:left-0 before:w-12 before:h-12 before:rounded-full before:bg-gradient-to-tr before:from-white before:to-transparent before:transition before:ease-linear before:duration-100 before:opacity-10 hover:before:opacity-30"
              [class.opacity-45]="isFirstSlide()"
            >
              <i class="bi bi-caret-left"></i>
            </li>
            <li
              class="portfolio-next list-none inline-flex justify-center items-center relative w-12 h-12 rounded-full text-white cursor-pointer before:content-[''] before:absolute before:top-0 before:left-0 before:w-12 before:h-12 before:rounded-full before:bg-gradient-to-tr before:from-white before:to-transparent before:transition before:ease-linear before:duration-100 before:opacity-10 hover:before:opacity-30"
              [class.opacity-45]="isLastSlide()"
            >
              <i class="bi bi-caret-right"></i>
            </li>
          </ul>
          <button
            routerLink="/portfolio"
            class="inline-block px-6 py-3 rounded-full text-white cursor-pointer transition ease-linear duration-75 bg-white/10 hover:bg-white/15"
          >
            Alle ansehen
          </button>
        </div>
      </div>
      <div class="overflow-visible mt-12">
        <swiper-container #swiperContainer init="false">
          @for (project of highlightProjects(); track project) {
            <swiper-slide>
              <a
                class="relative group block"
                [routerLink]="`/portfolio/${project.slug}`"
              >
                <div
                  class="overflow-hidden rounded-lg group-hover:scale-[0.98] transition-all ease-custom duration-500"
                >
                  <img
                    class="aspect-[1/0.6] object-cover group-hover:scale-105 transition-all ease-custom duration-500"
                    [ngSrc]="project.coverImage"
                    width="1920"
                    height="1080"
                    alt="Project cover image"
                  />
                </div>
                <!-- Category -->
                <div
                  class="z-[1] absolute top-5 right-5 bg-charcoal/30 px-4 py-2 rounded-full backdrop-blur-[5px] font-outfit font-medium uppercase text-sm text-white tracking-[1px] invisible opacity-0 transition-all ease-linear duration-100 group-hover:visible group-hover:opacity-100"
                >
                  {{
                    project.type === "own"
                      ? "Eigenes Vorhaben"
                      : "Kundenprojekt"
                  }}
                </div>
                <!-- Caption -->
                <div
                  class="z-[1] absolute right-5 bottom-5 left-5 opacity-50 transition ease-linear duration-75 group-hover:opacity-100 break-words hyphens-auto"
                >
                  <h3 class="font-outfit font-semibold text-3xl text-white">
                    {{ project.title }}
                  </h3>
                </div>
              </a>
            </swiper-slide>
          }
        </swiper-container>
        <!-- end portfolio-slider -->
      </div>
    </div>
  </div>
</div>
