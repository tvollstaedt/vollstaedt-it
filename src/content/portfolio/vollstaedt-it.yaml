description: |
  ### Idee

  Dieses Projekt erfüllt gleich mehrere angestrebte Ziele: Eine professionelle Präsentation meiner Tätigkeit als IT-Freelancer, Ort zum Festhalten und verbreiten meiner täglichen Erfahrungen im Geschäft und schließlich eine Referenzarbeit meiner Fähigkeiten.

  ### Meine Rolle
  Ich habe Konzept, Design und die vollständige technische Umsetzung der Website selbst verantwortet – inklusive CMS, Build-Setup und Deployment.

  ### Umsetzung
  Die Seite ist vollständig in Angular implementiert und nutzt moderne Ansätze und Fähigkeiten dieses Frameworks. Um optimal für Suchmaschinen ausgerichtet zu sein, nutze ich die __Server Side Rendering (SSR)__-Fähigkeiten von Angular voll aus. Hierbei wird der DOM der jeweiligen Unterseite auf dem Server vorgerendert, so dass nicht-Browser wie Suchmaschinen oder Bots bereits Struktur und Inhalte sämtlicher Seiten verarbeiten können, ohne JavaScript ausführen zu müssen.

  [[gallery]]

  Eine weitere Besonderheit ist das eigens entwickelte YAML-basierte CMS, was mir die einfache, Datei-basierte Pflege der Inhalte ermöglicht, ohne auf externe Abhängigkeiten zurückgreifen zu müssen. Hierfür nutze ich ein YAML-Dateiformat mit Kombination von `ngx-markdown`, um Text-Inhalte in HTML zu rendern.

  Weitere genutzte Angular-Features sind:
    * Vollständig "Zoneless"
    * Standalone Components
    * Lazy loaded routes
    * Signals / Signal inputs
    * View Transitions
    * Control-FLow-Syntax
    * Resource API zum Nachladen von Inhalten

  Der Sourcecode kann auf Gitlab eingesehen werden.
