description: |
  ### Idee

  Fliz war ein internes SaaS-Projekt mit dem Ziel, Dienstleister:innen im Bereich „Productized Services“ eine Plattform zur Abwicklung ihrer Kundenprozesse bereitzustellen – inklusive Benutzerverwaltung, Zahlungsabwicklung, Aufgabenmanagement und Kundenkommunikation.

  Das System wurde als __multi-tenant-fähige Plattform__ konzipiert: Ein Nutzer kann sowohl Anbieter als auch Kunde oder Mitarbeiter bei anderen Anbietern sein. Für jeden Anbieter wurde automatisiert ein eigenes Kanban-Board pro Kunde erzeugt, über das Aufgaben kommuniziert, priorisiert und abgearbeitet werden konnten.

  [[gallery]]

  ### Meine Rolle
  Als Ideengeber war ich verantwortlich für die vollständige technische Umsetzung der Plattform. Dazu gehörten die Auswahl, das Design und die Implementierung sämtlicher Services sowie die Integration externer Systeme.

  ### Umsetzung

  Fliz wurde als **Nx-Monorepo** aufgebaut, um Frontend und Backend effizient entwickeln zu können:

  - Das __Frontend__ basiert auf __Angular 16__ mit einem modernen Designsystem und responsivem Layout.
  - Das __Backend__ nutzt __NestJS__ und eine __PostgreSQL__-Datenbank zur strukturierten Ablage von Nutzern, Aufgaben und Rollen.
  - Für Authentifizierung und Autorisierung kam __Auth0__ zum Einsatz. Dadurch konnte in kurzer Zeit eine robuste Rechte- und Rollenlogik umgesetzt werden.
  - Die __Bezahlfunktionalität__ für Anbieter wurde über __Stripe__ eingebunden.

  ### Learnings

  Auch wenn das Projekt letztlich nicht veröffentlicht wurde, war es eine wertvolle Erfahrung in der schnellen Umsetzung komplexer Produktideen. Besonders das Thema **Multi-Tenancy** und das strukturierte Rechte-/Rollensystem in Kombination mit **Auth0** war technisch herausfordernd und spannend.

  Ein weiteres Learning: Bei MVPs und Prototyping kann man sich durch Tools wie __Firebase__ oder __Supabase__ viel Zeit sparen – insbesondere, wenn noch keine individuellen Backend-Anforderungen bestehen.
